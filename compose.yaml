services:
  app:
    build: ./app
    environment:
      EVENTS_MODE: ${EVENTS_MODE:-ok}
    ports:
      - "127.0.0.1:8093:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 10
